; PHP limits for the quote form (100 MB of plans plus form data).
; Hostinger reads this file for scripts in this folder; if uploads still fail, set the same
; values in hPanel > Advanced > PHP Configuration.
upload_max_filesize = 110M
post_max_size = 120M
max_file_uploads = 25
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
